name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DarkSoulsNotify-windows-x64.exe
            binary: DarkSoulsNotify.exe
          - os: ubuntu-latest
            artifact: DarkSoulsNotify-linux-x64
            binary: DarkSoulsNotify
          - os: macos-latest
            artifact: DarkSoulsNotify-macos-arm64
            binary: DarkSoulsNotify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build single-file executable
        run: python build.py

      - name: Rename release artifact
        shell: bash
        run: mv "dist/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - name: Smoke test executable
        shell: bash
        run: ./dist/${{ matrix.artifact }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
